# Asteroid Belt settings: EXAMPLE FILE with made-up values.
#
# This file is public. Never put real values here.
# Your real settings live in your private data folder at settings/settings.toml.
# scripts/init_data_dir.py copies this file there for you to fill in.
#
# Money is written as text ("1234.50") so it's never rounded by accident.

# Display names for each building. The code only uses the IDs on the left,
# so names can change here without touching any code. All nine are required.
[buildings]
planner = "Mission Control"
finance = "The Vault"
jobs = "Opportunity Office"
career = "Flight School"
mail = "Post Office"
relationships = "Crew Quarters"
projects = "Shipyard"
gym = "Training Bay"
library = "Data Core"

# Used to work out sunrise and sunset for day and night mode, on this Mac only.
[location]
name = "Example Town"
latitude = 51.4779
longitude = 0.0
timezone = "Europe/London"   # a name from the standard time zone list

[goals]
monthly_income = "4000.00"
currency = "CAD"

[tasks]
# Days without changes before a task is flagged as stale. Example value only.
stale_after_days = 14
# Default reminder time of day, 24-hour clock. Example value only.
reminder_time = "09:00"

[income]
# TEMPORARY PLACEHOLDER until an accountant gives a real figure.
# Shown in the app with a "placeholder" label while is_placeholder is true.
tax_set_aside_percent = "20"
tax_set_aside_is_placeholder = true
# Optional: day of the month the chequing statement is due (1 to 28, default 8).
# The Vault shows "Statement due" and sends one reminder from this day.
# statement_due_day = 8

# Optional: when each side-work platform pays, one block per platform.
# The id after "pay_schedules." is a short code; "name" is what the app shows.
# Log entries whose company is this id get expected pay and arrival dates.
# Example values only.
# [pay_schedules.platform_a]
# name = "Platform A"
# period = "weekly"
# week_starts = "saturday"                 # pay weeks run Saturday to Friday
# released_days_after_period_end = [5, 6]  # [earliest, latest] days after the week's last day
# arrives_days_after_release = [3, 4]      # [earliest, latest] days after release
# deposit_match = "PLATFORM A"           # optional: text in a statement deposit from this platform

# Optional: the main job's pay as it appears in a chequing statement (for the Vault's import).
# Example values only.
# A company whose pay timing isn't known yet can be just a name (add all four
# timing settings later, or none):
# [pay_schedules.platform_b]
# name = "Platform B"

# [main_job]
# name = "Day job"
# deposit_match = "DAY JOB PAY"          # text found in the pay deposit's description

# Optional: fixed blocks for Mission Control's Daily plan, repeated every week.
# kind: work | commute | gym | other. days: mon tue wed thu fri sat sun.
# Times are 24-hour "HH:MM"; a block must end later than it starts (none past midnight).
# The Daily plan builds each week from these. Example values only.
# [plan]
# The Sunday check-in plans the coming week. Optional times (defaults shown):
# checkin_opens = "12:00"      # available from this time on Sunday
# checkin_reminder = "16:00"   # one reminder at this time if the week isn't planned yet
#
# [[plan.blocks]]
# title = "Commute"
# kind = "commute"
# days = ["mon", "tue"]
# start = "07:30"
# end = "08:00"
#
# [[plan.blocks]]
# title = "Work"
# kind = "work"
# days = ["mon", "tue", "wed", "thu", "fri"]
# start = "09:00"
# end = "12:00"
#
# [[plan.blocks]]
# title = "Gym"
# kind = "gym"
# days = ["mon", "tue", "wed", "thu", "fri"]
# start = "12:00"
# end = "13:00"
#
# [[plan.blocks]]
# title = "Work"
# kind = "work"
# days = ["mon", "tue", "wed", "thu", "fri"]
# start = "13:00"
# end = "17:00"
#
# Usual events: one-tap chips at the Sunday check-in. day is optional (without it you pick a
# day when adding). kind: event | side_work | build | other (default event).
# [[plan.usual_events]]
# title = "Team sport"
# day = "thu"
# start = "21:00"
# end = "22:00"
#
# [[plan.usual_events]]
# title = "Games night"
# start = "19:00"
# end = "21:00"

# Optional: routines, repeating prep checklists shown in the Daily plan's Today list.
# Ticks reset every day. id: lowercase letters, digits or _. days as for [[plan.blocks]].
# shows_from: when the card lights up; remind_at (optional): one reminder that day if anything
# is still unticked. items: 1 to 20 different short texts. Example values only.
# [[routines]]
# id = "evening_prep"
# title = "Evening prep"
# days = ["sun", "mon", "tue", "wed", "thu"]
# shows_from = "19:00"
# remind_at = "21:30"
# items = ["Lunch made", "Keys by the door", "Clothes laid out"]
